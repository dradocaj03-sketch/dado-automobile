<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dado Automobile — Rechteverwaltung</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 0.7rem; font-weight: normal; padding: 2px 8px; border-radius: 10px; background: #2563eb; color: white; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .status-dot.ok { background: #22c55e; }
  .status-dot.err { background: #ef4444; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
  input, select { padding: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
  button { padding: 6px 14px; border-radius: 6px; border: none; background: #2563eb; color: white; cursor: pointer; font-size: 0.9rem; }
  button.danger { background: #ef4444; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #addForm { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; align-items: center; }
  #diagnose { font-size: 0.85rem; color: #666; margin-top: 6px; }
  #gate { text-align: center; padding: 60px 0; }
</style>
</head>
<body>

<h1>Dado Automobile — Rechteverwaltung <span class="badge">v0.1</span></h1>
<div id="diagnose"><span class="status-dot" id="statusDot"></span> <span id="statusText">Lädt…</span></div>

<div id="gate">
  <button id="loginBtn">Mit Google anmelden</button>
</div>

<div id="app" style="display:none;">
  <p>Angemeldet als <strong id="whoami"></strong></p>

  <form id="addForm">
    <input type="email" id="newEmail" placeholder="email@beispiel.de" required />
    <select id="newRole">
      <option value="super">super (voller Zugriff)</option>
      <option value="app">app (nur bestimmte Apps)</option>
    </select>
    <input type="text" id="newApps" placeholder="apps, komma-getrennt (nur bei 'app')" />
    <button type="submit">Hinzufügen</button>
  </form>

  <table>
    <thead><tr><th>E-Mail</th><th>Rolle</th><th>Apps</th><th>Hinzugefügt</th><th></th></tr></thead>
    <tbody id="adminsBody"></tbody>
  </table>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged,
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import {
    getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp,
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
  import {
    getFunctions, httpsCallable,
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";

  const firebaseConfig = {
    projectId: "dado-automobile-ca04c",
    appId: "1:163470074312:web:b69cf5e92c93e94f5820fd",
    storageBucket: "dado-automobile-ca04c.firebasestorage.app",
    apiKey: "AIzaSyCN3gy4mgD5MbjNz5r6P8FKxMmIuELCTO4",
    authDomain: "dado-automobile-ca04c.firebaseapp.com",
    messagingSenderId: "163470074312",
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);
  const functions = getFunctions(fbApp);
  const claimSelfFromAdmins = httpsCallable(functions, "claimSelfFromAdmins");

  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const gate = document.getElementById("gate");
  const appEl = document.getElementById("app");
  const whoami = document.getElementById("whoami");
  const adminsBody = document.getElementById("adminsBody");

  function setStatus(ok, text) {
    statusDot.className = "status-dot " + (ok ? "ok" : "err");
    statusText.textContent = text;
  }

  document.getElementById("loginBtn").addEventListener("click", async () => {
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch (e) {
      setStatus(false, "Anmeldung fehlgeschlagen: " + e.message);
    }
  });

  let unsubscribe = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      gate.style.display = "block";
      appEl.style.display = "none";
      if (unsubscribe) unsubscribe();
      setStatus(true, "Nicht angemeldet.");
      return;
    }

    setStatus(true, "Gleiche Rechte ab…");
    try {
      await claimSelfFromAdmins();
      // Frisches Token holen, damit neue Custom Claims sichtbar werden.
      await user.getIdTokenResult(true);
    } catch (e) {
      setStatus(false, "Rechte-Abgleich fehlgeschlagen: " + e.message);
      return;
    }

    const tokenResult = await user.getIdTokenResult();
    const isAdmin = tokenResult.claims.admin === true;

    if (!isAdmin) {
      gate.style.display = "block";
      appEl.style.display = "none";
      setStatus(false, "Angemeldet als " + user.email + ", aber kein Admin-Zugriff.");
      return;
    }

    gate.style.display = "none";
    appEl.style.display = "block";
    whoami.textContent = user.email;
    setStatus(true, "Bereit.");

    if (unsubscribe) unsubscribe();
    unsubscribe = onSnapshot(collection(db, "admins"), (snap) => {
      adminsBody.innerHTML = "";
      snap.forEach((docSnap) => {
        const d = docSnap.data();
        const tr = document.createElement("tr");
        const addedAt = d.addedAt?.toDate ? d.addedAt.toDate().toLocaleString("de-DE") : "-";
        tr.innerHTML = `
          <td>${d.email || docSnap.id}</td>
          <td>${d.role || ""}</td>
          <td>${(d.apps || []).join(", ")}</td>
          <td>${addedAt}</td>
          <td><button class="danger" data-id="${docSnap.id}">Entfernen</button></td>
        `;
        tr.querySelector("button").addEventListener("click", async () => {
          if (confirm(`Zugriff für ${d.email || docSnap.id} wirklich entfernen?`)) {
            await deleteDoc(doc(db, "admins", docSnap.id));
          }
        });
        adminsBody.appendChild(tr);
      }, (err) => {
        setStatus(false, "Fehler beim Laden: " + err.message);
      });
    });
  });

  document.getElementById("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("newEmail").value.trim().toLowerCase();
    const role = document.getElementById("newRole").value;
    const apps = document.getElementById("newApps").value
      .split(",").map((s) => s.trim()).filter(Boolean);

    await setDoc(doc(db, "admins", email), {
      email,
      role,
      apps,
      addedBy: auth.currentUser.email,
      addedAt: serverTimestamp(),
    }, { merge: true });

    e.target.reset();
  });

  // Wiederherstellungsfunktion global erreichbar (siehe CLAUDE.md Betriebsregeln).
  window.forceClaimRefresh = async () => {
    await claimSelfFromAdmins();
    await auth.currentUser?.getIdTokenResult(true);
    location.reload();
  };
  console.log("Falls die Oberfläche hakt: window.forceClaimRefresh() in der Konsole aufrufen.");
</script>

</body>
</html>
